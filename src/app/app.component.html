<div class="container mt-5" style="max-width: 600px;">
  <h1 class="text-center mb-4 fw-bold">📝 Task Tracker</h1>

  <div class="input-group mb-4 shadow">
    <input 
      type="text" 
      class="form-control form-control-lg" 
      placeholder="Add a new task..." 
      [(ngModel)]="newTask"
      (keyup.enter)="addTask()">
    <button class="btn btn-primary btn-lg" (click)="addTask()">Add Task</button>
  </div>

  <ul class="list-group">
    <li *ngFor="let task of tasks; let i = index" 
        class="list-group-item d-flex justify-content-between align-items-center shadow-sm mb-2 rounded">
      <span>{{ task }}</span>
      <button class="btn btn-danger btn-sm" (click)="deleteTask(i)">Delete</button>
    </li>
  </ul>

  <p *ngIf="tasks.length === 0" class="text-muted text-center mt-4">No tasks yet. Add one!</p>
</div>
